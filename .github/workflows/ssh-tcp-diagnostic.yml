name: SSH TCP diagnostic

on:
  workflow_dispatch:

permissions: {}

jobs:
  check-public-bastion-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check TCP port 22 without SSH authentication
        env:
          SSH_HOST: ${{ secrets.PUBLIC_HOST }}
        shell: bash
        run: |
          set -uo pipefail

          if timeout 15 bash -c 'exec 3<>"/dev/tcp/${SSH_HOST}/22"' 2>/dev/null; then
            echo "TCP port 22 is reachable from this GitHub-hosted runner."
            exit 0
          fi

          echo "TCP port 22 is not reachable from this GitHub-hosted runner."
          exit 1

  check-private-ssh-via-bastion:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify SSH transport without deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRIVATE_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          proxy_host: ${{ secrets.PUBLIC_HOST }}
          proxy_username: ${{ secrets.SSH_USER }}
          proxy_key: ${{ secrets.SSH_KEY }}
          script: 'true'
